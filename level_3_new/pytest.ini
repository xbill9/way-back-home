[pytest]
# Default collection covers only the suites that can actually fail and that run
# offline. The root-level test_*.py files are manual smoke checks: they swallow
# every exception, two need a server already on ws://127.0.0.1:8080, and
# test_live_connection.py makes a real billed Live API call against a .env that
# only exists after runadk.sh -- it raises at *import*, which used to abort the
# whole session at collection. Leaving them out of testpaths keeps `make test`
# runnable with no key and no charge; run them explicitly when you want them:
#
#   python -m pytest test_ws_backend.py        # needs a live server
#   python -m pytest test_live_connection.py   # BILLED
testpaths =
    tests
    backend/app/biometric_agent

markers =
    anyio: async test run by the anyio plugin (used by the root-level smoke checks)
    live: makes a real, billed Gemini Live API call
    needs_server: requires a backend already listening on 127.0.0.1:8080

filterwarnings =
    ignore::DeprecationWarning:abc
